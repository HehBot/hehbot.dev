<li class="post-row">
  <time datetime="{{ .Date.Format "2006-01-02" }}" class="post-date">
    {{ .Date.Format "2006-01-02" }}
  </time>

  {{ with .Params.post_num }}
    <span class="post-num">#{{ printf "%03d" . }}</span>
  {{ end }}

  <a href="{{ .RelPermalink }}" class="post-title">{{ .Title }}</a>
</li>
