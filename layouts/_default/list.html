<!DOCTYPE html>
<html lang="en">
{{ partial "head.html" . }}
<body>

  {{ partial "header.html" . }}

  <main>
    <h2>All Posts</h2>
    <ul class="post-list">
      <!-- List of All Posts -->
      {{ range (where .Site.RegularPages "Type" "posts") }}
        {{ partial "post-row.html" . }}
      {{ end }}
    </ul>
  </main>

  {{ partial "footer.html" . }}

</body>
</html>
