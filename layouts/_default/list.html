<!DOCTYPE html>
<html lang="en">
{{ partial "head.html" . }}
<body>

  {{ partial "header.html" . }}

  <main>
    <h2>All Posts</h2>
    <ul class="post-list">
      <!-- List of All Posts -->
      {{ range (where .Site.RegularPages "Section" "posts") }}
      <li class="post-item">
        <div>
          {{ with .Params.post_num }}
            <span style="font-family: monospace; color: #888; margin-right: 0.5rem;">#{{ printf "%03d" . }}</span>
          {{ end }}
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </div>
        <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
      </li>
      {{ end }}
    </ul>
  </main>

  {{ partial "footer.html" . }}

</body>
</html>
